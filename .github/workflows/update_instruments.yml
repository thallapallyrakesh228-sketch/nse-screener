name: Auto Update Full NSE Stock List

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  generate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Download & Extract All NSE Stocks
        run: |
          python -c "
          import urllib.request, gzip, csv, io, json
          url = 'https://assets.upstox.com/market-quote/instruments/exchange/NSE.csv.gz'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          instruments = {}
          with urllib.request.urlopen(req) as resp:
              content = resp.read()
              with gzip.GzipFile(fileobj=io.BytesIO(content)) as gz:
                  reader = csv.DictReader(io.TextIOWrapper(gz, encoding='utf-8'))
                  for row in reader:
                      seg = str(row.get('segment') or row.get('exchange') or '').upper()
                      itype = str(row.get('instrument_type') or '').upper()
                      key = row.get('instrument_key')
                      sym = row.get('tradingsymbol') or row.get('trading_symbol') or row.get('name')
                      if ('NSE_EQ' in seg or seg == 'NSE') and itype == 'EQ':
                          if key and sym and not sym.endswith('-BE') and not sym.endswith('-BZ'):
                              instruments[key] = sym
          with open('instruments.json', 'w') as f:
              json.dump(instruments, f, indent=2)
          print(f'Successfully generated instruments.json with {len(instruments)} NSE stocks.')
          "

      - name: Commit Full JSON to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add instruments.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated full NSE instruments list" && git push)
          
